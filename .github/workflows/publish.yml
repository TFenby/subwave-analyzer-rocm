# Rebuild on top of upstream's latest release. Daily cron skips when our
# ghcr already has that version; a manual dispatch always builds.
name: publish
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/subwave-analyzer-rocm
    steps:
      - uses: actions/checkout@v4

      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(gh api repos/perminder-klair/subwave/releases/latest --jq .tag_name)
          ver=${tag#v}
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "minor=${ver%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: exists
        if: github.event_name == 'schedule'
        run: |
          if docker buildx imagetools inspect "${IMAGE,,}:${{ steps.ver.outputs.ver }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The 4.5 GB ROCm torch wheel plus a ~7 GB image overflow the runner's
      # ~14 GB root filesystem; these preinstalled toolchains are unused here.
      - name: Free runner disk space
        if: steps.exists.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: UPSTREAM_TAG=${{ steps.ver.outputs.ver }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.ver }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.minor }}
            ${{ env.IMAGE }}:latest
