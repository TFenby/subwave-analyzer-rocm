# Rebuild on top of upstream's latest release. Daily cron skips when our
# ghcr already has that version; a manual dispatch always builds.
name: publish
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/subwave-analyzer-rocm
    steps:
      - uses: actions/checkout@v4

      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(gh api repos/perminder-klair/subwave/releases/latest --jq .tag_name)
          ver=${tag#v}
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "minor=${ver%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: exists
        if: github.event_name == 'schedule'
        run: |
          if docker buildx imagetools inspect "${IMAGE,,}:${{ steps.ver.outputs.ver }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The image is ~31 GB unpacked (the ROCm torch wheel alone is 21 GB) and
      # the runner's root filesystem has ~14 GB free. /mnt is a separate,
      # mostly empty ~70 GB disk on GitHub-hosted runners, so move Docker's
      # data root there instead of pruning toolchains from /.
      - name: Move Docker data root to /mnt
        if: steps.exists.outputs.skip != 'true'
        run: |
          sudo systemctl stop docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: UPSTREAM_TAG=${{ steps.ver.outputs.ver }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.ver }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.minor }}
            ${{ env.IMAGE }}:latest
