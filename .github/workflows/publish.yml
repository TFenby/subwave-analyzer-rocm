# Rebuild on top of upstream's latest release. Hourly cron skips (in ~12 s)
# when our ghcr already has that version; a manual dispatch always builds.
# Hourly, not daily: GitHub starts scheduled runs 6-10 h late on this repo,
# so a daily poll left a new release unbuilt for up to ~34 h.
name: publish
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          tag=$(gh api repos/perminder-klair/subwave/releases/latest --jq .tag_name)
          ver=${tag#v}
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "minor=${ver%.*}" >> "$GITHUB_OUTPUT"
          # Image names must be lowercase; the owner login is not.
          echo "image=ghcr.io/${OWNER,,}/subwave-analyzer-rocm" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: exists
        if: github.event_name == 'schedule'
        run: |
          if docker buildx imagetools inspect "${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.ver }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The image is ~31 GB unpacked (the ROCm torch wheel alone is 21 GB).
      # ubuntu-latest currently has ~86 GB free on /, so no disk juggling;
      # this line is here so a future ENOSPC has a number next to it.
      - run: df -h /
        if: steps.exists.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: UPSTREAM_TAG=${{ steps.ver.outputs.ver }}
          tags: |
            ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.ver }}
            ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.minor }}
            ${{ steps.ver.outputs.image }}:latest
